<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>2주차</title>
    </head>
    <body>
        <form>
            <h2>Number count/reset</h2>
            <div id="number">0</div>
            <input type="button" value="count" onclick="xCount()" />
            <input type="button" value="reset" onclick="xReset()" />
        </form>
        <form>
            <h2>반복문 연습</h2>
            <input type="button" value="for" onclick="for1()" />
            <input type="button" value="2중 for" onclick="for2()" />
            <input type="button" value="2중 for 변형" onclick="for3()" />
            <input type="button" value="pr" onclick="pr()" />
        </form>
        <form>
            <h2>1단계 계산</h2>
            <input type="number" id="txt11" size="5" />
            +
            <input type="number" id="txt12" size="5" />
            <input type="button" value="계산" onclick="add1()" />
            <h2>결과: <span id="total1"></span></h2>
        </form>
        <form>
            <h2>2단계 계산</h2>
            <input type="number" id="txt21" size="5" />
            +
            <input type="number" id="txt22" size="5" />
            <input type="button" value="계산" onclick="add2()" />
            <h2>결과: <span id="total2"></span></h2>
        </form>
        <script src="./2.js"></script>
    </body>
</html>
