<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <title>게시판 글쓰기</title>
    </head>
    <body>
        <h3>게시판 글쓰기</h3>
        <form action="/iBoard" method="post">
            <hr />
            <label>제목 : <input type="text" name="title" required /></label><br />
            <label>내용 : <textarea name="content" required></textarea></label><br />
            <label>날짜 : <input type="date" name="date" required /></label>
            <div>
                <input type="submit" value="저장" />
                <input type="reset" value="취소" />
            </div>
        </form>
    </body>
</html>
