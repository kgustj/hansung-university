<!doctype html>
<html lang="ko">
    <head>
        <title>계산 문제</title>
    </head>

    <body onload="start()">
        <h3>계산 문제를 풀어 봅시다.</h3>
        <p>문제는 자동으로 생성되며, 10초가 지나면 자동 채점됩니다.</p>
        <div>남은 시간 <span id="clock">10</span></div>
        <hr />
        <form>
            <table>
                <tr>
                    <td class="question"></td>
                    <td><input class="answer" type="text" size="8" /></td>
                </tr>
                <tr>
                    <td class="question"></td>
                    <td><input class="answer" type="text" size="8" /></td>
                </tr>
                <tr>
                    <td class="question"></td>
                    <td><input class="answer" type="text" size="8" /></td>
                </tr>
                <tr>
                    <td class="question"></td>
                    <td><input class="answer" type="text" size="8" /></td>
                </tr>
                <tr>
                    <td><button type="button" onclick="start()">다시</button></td>
                    <td><span id="score">0</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</td>
                </tr>
            </table>
        </form>

        <script>
            let timer = null;
            let answers = [];

            function start() {
                clearInterval(timer);

                document.querySelector("#clock").innerHTML = 10;
                document.querySelector("#score").innerHTML = 0;

                const qs = document.querySelectorAll(".question");
                const as = document.querySelectorAll(".answer");
                answers = [];

                for (let i = 0; i < qs.length; i++) {
                    const a = Math.floor(Math.random() * 50) + 1;
                    const b = Math.floor(Math.random() * 50) + 1;
                    qs[i].innerHTML = a + " + " + b;
                    answers[i] = a + b;

                    as[i].value = "";
                    as[i].disabled = false;
                }

                timer = setInterval(function () {
                    const count = Number(clock.innerHTML) - 1;
                    clock.innerHTML = count;

                    if (count <= 0) {
                        clearInterval(timer);
                        grade();
                    }
                }, 1000);
            }

            function grade() {
                const as = document.querySelectorAll(".answer");
                let score = 0;

                for (let i = 0; i < as.length; i++) {
                    if (Number(as[i].value) == answers[i]) {
                        score++;
                    }
                    as[i].disabled = true;
                }

                document.querySelector("#score").innerHTML = "결과: " + score;
            }
        </script>
    </body>
</html>
